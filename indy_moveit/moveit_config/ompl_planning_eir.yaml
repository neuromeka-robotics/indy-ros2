planner_configs:
    RRTConnectkConfigDefault:
        type: geometric::RRTConnect
        range: 0.0
    RRTstarkConfigDefault:
        type: geometric::RRTstar
        range: 0.0
        goal_bias: 0.05
        delay_collision_checking: 1
    PRMkConfigDefault:
        type: geometric::PRM
        max_nearest_neighbors: 10
    PRMstarkConfigDefault:
        type: geometric::PRMstar
left_arm:
    planner_configs:
        - RRTConnectkConfigDefault
        - RRTstarkConfigDefault
        - PRMkConfigDefault
        - PRMstarkConfigDefault
right_arm:
    planner_configs:
        - RRTConnectkConfigDefault
        - RRTstarkConfigDefault
        - PRMkConfigDefault
        - PRMstarkConfigDefault
dual_arm:
    planner_configs:
        - RRTConnectkConfigDefault
        - RRTstarkConfigDefault
        - PRMkConfigDefault
        - PRMstarkConfigDefault
